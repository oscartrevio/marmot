name: test

# One job on pull requests: shellcheck + the bats suite. tests/run.sh adds --jobs $(nproc) when GNU
# parallel is installed, as on the runner, so files run side by side; files that set
# BATS_NO_PARALLELIZE_WITHIN_FILE stay serial inside. Docs-only and website-only changes skip it
# (web.yml checks the website), and a new push cancels the run it replaces. The end-to-end scenario (tests/e2e/run.sh) runs locally, not here.
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "apps/**/*.ts"
      - "apps/**/*.tsx"
      - "apps/**/*.css"
      - "apps/**/*.json"
      - "apps/**/*.mjs"
      - "*.json"
      - "*.ts"
      - "bun.lock"
      - ".vscode/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends bats shellcheck
      - run: tests/run.sh
