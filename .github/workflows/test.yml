name: test

# One job on pull requests: shellcheck + the bats suite, one file at a time (a few tests time
# processes and redraws and flake under parallel load). Docs-only changes skip it, and a new push
# cancels the run it replaces. The end-to-end scenario (tests/e2e/run.sh) runs locally, not here.
on:
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends bats shellcheck
      - run: tests/run.sh
